name: Release builder

on:
  workflow_call:
    inputs:
      device:
        type: string
        required: true
      device_name:
        type: string
        required: true
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      DEVICE: ${{ inputs.device }}
      DEVICE_NAME: ${{ inputs.device_name }}

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev zstd zip jq cpio

      - name: Set Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run build script
        run: |
          chmod +x build.sh
          export DEVICE=${{ env.DEVICE }}
          ./build.sh

      - name: Set Build End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Set ZIP File Path
        run: |
          zip=$(ls not-*.zip 2>/dev/null | head -n1)
          if [ -z "$zip" ]; then
            echo "No ZIP found!"
            exit 1
          fi
          echo "zip_file=$zip" >> $GITHUB_ENV

      - name: Upload to Gofile
        run: |
          SERVER=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty' || true)
          if [ -n "$SERVER" ]; then
            UPLOAD_URL="https://${SERVER}.gofile.io/contents/uploadfile"
          else
            UPLOAD_URL="https://upload.gofile.io/uploadfile"
          fi
          RESP=$(curl -fsSL -F "file=@${{ env.zip_file }}" "$UPLOAD_URL" || true)
          GOFILE_URL=$(echo "$RESP" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
          echo "GOFILE_URL=${GOFILE_URL:-Unavailable}" >> $GITHUB_ENV
          echo "Gofile download URL: ${GOFILE_URL:-Unavailable}"
          {
            echo "### Flashable ZIP"
            echo "- File: \`${{ env.zip_file }}\`"
            echo "- Gofile: ${GOFILE_URL:-Unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}-${{ github.sha }}
          path: ${{ env.zip_file }}

      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping Telegram upload."
            exit 0
          fi
          gitsha1=$(git rev-parse --short HEAD)
          zip_file="${{ env.zip_file }}"
          DEVICE_NAME_ESCAPED=$(echo "$DEVICE_NAME" | sed 's/[][_*()~`>#+=|{}.!-]/\\&/g')
          DEVICE_ESCAPED=$(echo "$DEVICE" | sed 's/[][_*()~`>#+=|{}.!-]/\\&/g')
          printf "| Localversion: %s\n | Build Date: %s\n | Build commit hash: %s\n | KernelSU: yes\n | SELinux: Enforcing" \
            "$(cat out/include/config/kernel.release)" "$(date +'%d %B %Y')" "$gitsha1" > buildDetails.txt
          buildDetails="$(cat buildDetails.txt)"
          msg="*not\\-kernel* build for the *${DEVICE_NAME_ESCAPED} \\(${DEVICE_ESCAPED}\\)*
          * *
          \`\`\`
          $buildDetails
          \`\`\`
          *@not\\_kernel \\| @sKernelSU*
          * * "
          curl -fsSL -F document=@"$zip_file" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F "disable_web_page_preview=true" \
            -F "parse_mode=markdownv2" \
            -F caption="$msg"

      - name: Set release tag
        run: echo "RELEASE_TAG=${DEVICE}-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Prepare Release Info
        run: |
          set -e
          echo "KERNEL_VERSION=$(cat out/include/config/kernel.release)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%d %B %Y')" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "CLANG_VERSION=$(${{ github.workspace }}/tc/clang/bin/clang --version | head -n1)" >> $GITHUB_ENV
          KSU_VERSION=$(grep -m1 -oE 'KSU_VERSION=[0-9]+' out/drivers/kernelsu/.ksu.o.cmd 2>/dev/null | cut -d= -f2 || true)
          [ -z "$KSU_VERSION" ] && KSU_VERSION="SukiSU-Nova (UAPI v6)"
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          KSU_VERSION_STR=$(grep -m1 -oE 'KSU_VERSION_FULL=\\"[^\\"]+\\"' out/drivers/kernelsu/.ksu.o.cmd 2>/dev/null | sed -E 's/.*\\"([^\\"]+)\\"/\1/' || git -C KernelSU rev-parse --short HEAD 2>/dev/null || true)
          [ -z "$KSU_VERSION_STR" ] && KSU_VERSION_STR="Unknown"
          echo "KSU_VERSION_STR=$KSU_VERSION_STR" >> $GITHUB_ENV
          SUSFS_VERSION=$(grep -m1 'SUSFS_VERSION' ./include/linux/susfs.h 2>/dev/null | awk -F'"' '{print $2}' || true)
          [ -z "$SUSFS_VERSION" ] && SUSFS_VERSION="None"
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Debug ZIP
        run: ls -lh "${{ env.zip_file }}"

      - name: Create Release and Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: aura_kernel 6.7.0 (${{ env.KERNEL_VERSION }}) for ${{ env.DEVICE_NAME }}
          files: ${{ env.zip_file }}
          body: |
             Clang version: ${{ env.CLANG_VERSION }}
             Build Date: ${{ env.BUILD_DATE }}
             SukiSU-Nova version: ${{ env.KSU_VERSION }} / ${{ env.KSU_VERSION_STR }}
             SusFS version: ${{ env.SUSFS_VERSION }}
             SELinux: Enforcing
             Commit: ${{ env.COMMIT_HASH }}
             Gofile: ${{ env.GOFILE_URL }}
             Build completed in: ${{ env.BUILD_DURATION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
